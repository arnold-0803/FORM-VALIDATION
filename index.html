<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>form | validation</title>
</head>
<body>
  <form novalidate>
    <h2>Form</h2>
    <div class="input-fields">
      <div class="field">
        <label for="email-input">Email</label>
        <input type="email" name="email" placeholder="Email" id="email-input" required>
        <span class="error-message"></span>
      </div>
      <div class="field">
        <label for="country-input">Country</label>
        <input type="text" name="country" placeholder="Country" id="country-input" required>
        <span class="error-message"></span>
      </div>
      <div class="field">
        <label for="postal-code-input">Postal code</label>
        <input type="text" name="postal-code" placeholder="Postal code" id="postal-code-input" required maxlength="6">
        <span class="error-message"></span>
      </div>
      <div class="field">
        <label for="password-input">Password</label>
        <input type="password" name="password" placeholder="Password" id="password-input" minlength="8" required>
        <span class="error-message"></span>
      </div>
      <div class="field">
        <label for="confirm-password-input">Confirm password</label>
        <input type="password" name="confirm-password" placeholder="Confirm password" id="confirm-password-input" required>
        <span class="error-message"></span>
      </div>
    </div>
    <button type="submit" id="submit-btn">Submit</button>
    <p id="success-message" aria-live="polite"></p>
  </form>

  <script src="script.js"></script>
</body>
</html>
